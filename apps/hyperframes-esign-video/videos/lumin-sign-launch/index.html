<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="vendor-gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #fdfae7;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1280"
      data-height="720"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-02-upload"
        class="scene"
        data-composition-id="02-upload"
        data-composition-src="compositions/frames/02-upload.html"
        data-start="5"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-place-field"
        class="scene"
        data-composition-id="03-place-field"
        data-composition-src="compositions/frames/03-place-field.html"
        data-start="10"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-04-sign"
        class="scene"
        data-composition-id="04-sign"
        data-composition-src="compositions/frames/04-sign.html"
        data-start="15"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-countersign"
        class="scene"
        data-composition-id="05-countersign"
        data-composition-src="compositions/frames/05-countersign.html"
        data-start="20"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-06-audit"
        class="scene"
        data-composition-id="06-audit"
        data-composition-src="compositions/frames/06-audit.html"
        data-start="25"
        data-duration="5"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
