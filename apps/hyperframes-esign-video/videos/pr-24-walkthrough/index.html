<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="vendor-gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #FAF9F5;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16"
      data-width="1280"
      data-height="720"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-02-change"
        class="scene"
        data-composition-id="02-change"
        data-composition-src="compositions/frames/02-change.html"
        data-start="3"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-03-diff"
        class="scene"
        data-composition-id="03-diff"
        data-composition-src="compositions/frames/03-diff.html"
        data-start="6"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-04-impact"
        class="scene"
        data-composition-id="04-impact"
        data-composition-src="compositions/frames/04-impact.html"
        data-start="10"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-05-credits"
        class="scene"
        data-composition-id="05-credits"
        data-composition-src="compositions/frames/05-credits.html"
        data-start="13"
        data-duration="3"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
