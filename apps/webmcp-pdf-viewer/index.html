<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebMCP PDF Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <div class="brand">
          <h1>WebMCP PDF Viewer</h1>
          <span id="webmcp-badge" class="badge badge--unknown">Checking WebMCP…</span>
        </div>
        <div class="toolbar" id="viewer-toolbar">
          <button type="button" id="btn-prev" title="Previous page" disabled>← Prev</button>
          <label class="page-control">
            Page
            <input type="number" id="page-input" min="1" value="1" disabled />
            <span id="page-count">/ —</span>
          </label>
          <button type="button" id="btn-next" title="Next page" disabled>Next →</button>
          <select id="zoom-select" aria-label="Zoom" disabled>
            <option value="fit-width">Fit width</option>
            <option value="fit-page">Fit page</option>
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
          </select>
        </div>
      </header>
      <main class="layout">
        <section class="viewer-pane" aria-label="PDF viewer">
          <div id="viewer-wrap">
            <canvas id="pdf-canvas"></canvas>
          </div>
          <p id="status-line" class="status-line">Loading sample PDF…</p>
        </section>
        <aside class="agent-pane" aria-label="Agent tools">
          <h2>Agent panel</h2>
          <p class="hint">
            Same handlers as WebMCP tools — use this when WebMCP is not enabled in Chrome.
          </p>
          <label class="field">
            Tool
            <select id="agent-tool"></select>
          </label>
          <label class="field">
            Arguments (JSON)
            <textarea id="agent-args" rows="6" spellcheck="false">{}</textarea>
          </label>
          <button type="button" id="agent-run" class="primary">Run tool</button>
          <pre id="agent-output" class="output" aria-live="polite">{}</pre>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
