name: univer-quote-to-sign

on:
  push:
    paths:
      - "apps/univer-quote-to-sign/**"
      - ".github/workflows/univer-quote-to-sign.yml"
  pull_request:
    paths:
      - "apps/univer-quote-to-sign/**"
      - ".github/workflows/univer-quote-to-sign.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/univer-quote-to-sign
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
